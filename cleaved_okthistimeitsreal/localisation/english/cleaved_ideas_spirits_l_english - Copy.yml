    shared_mewman_californian_resistance:0 "Californian Resistance"
    shared_mewman_californian_resistance_desc:0 "Our human population is very significant, in fact they outnumber Mewmans. These liberals do not understand the merits of the Mewman Monarchy, and they are not afraid to let that be known."
    
    cleaved_mewman_restorationism_natl_sprt:0 "Mewman Restorationism"
    cleaved_mewman_restorationism_natl_sprt_desc:0 "\n\n\n£mewman_restorationism_tfr_style_popup_desc_texticon \n\n\n\n§C"Lookin' pretty good, kids! Now we can put on our costumes, and after that: THE BLOODY BATTLE CAN COMMENCE!"§!\n§YMewman Restorationism§! is a primarily Mewman socio-political movement arising from the Mewman Crisis. It's main goal is the §Yre-unification§! of the former lands and peoples of the pre-cleaved Kingdom of Mewni through any means necessary. Mewman Restorationism advocates for militarism and aggression in foreign affairs, drawing inspiration both from Mewni's military and conquest-heavy past and certain human philosophies, mainly classical nationalism and Realpolitik.\n\nMewman Restorationism is distinct from general unity sentiments because of it's disregard for the traditional Mewman ideas around casus belli. Instead of viewing the consolidation of the Mewman state through claims of aristocrats, Mewman Restorationism bases itself on the idea of a unified Mewman people/identity, who should be united under one nation.\n\nThis ideology is highly malleable, and almost any Mewman government trying to unite Mewni can adopt it to justify Machiavellian power grabs and territory consolidation."
    
