    shared_mewman_matriarchy_idea:0 "Mewman Matriarchy"
    shared_mewman_matriarchy_idea_desc:0 "\n\n\n£mewman_matriarchy_popup_desc_texticon \n\n\n\nThe royal lines of succession have historically prioritized women, with there only being one recorded Mewman king (Jushtin). Reflecting political power dynamics, Women have taken a more prominent role in Mewman society in all levels."
    
