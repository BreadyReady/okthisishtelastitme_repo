l_english:
    shared_mewman_matriarchy_idea:0 "Mewman Matriarchy"
    shared_mewman_matriarchy_idea_desc:0 "The royal lines of succession have historically prioritized women, with there only being one recorded Mewman king (Jushtin). Reflecting political power dynamics, Women have taken a more prominent role in Mewman society in all levels."
    
    shared_mewman_monster_rights_idea:0 "Neglected Monster Rights"
    shared_mewman_monster_rights_idea_desc:0 "While there have been some attempts to reform Monster rights under Eclipsa, they were largely ineffective, contreversial, and were mostly de-facto rolled back because of the Mewman Crisis. Laws being enforced regarding monsters date back centuries, and they are largely tailored around opressing them and holding them back from developing as a group. Depsite this, there are well a few known loopholes that allow some monsters to propser."
    
    shared_mewman_monster_rights_good_reform_idea:0 "Reforming Monster Rights"
    shared_mewman_monster_rights_good_reform_idea_desc:0 "[Root.GetLeader]'s government publicly intends to reform monster rights laws to uplift the monster community and break free from Mewni's hateful past. "
    
    shared_mewman_monster_rights_good_reform_idea_2:0 "The Monster Rights Act"
    shared_mewman_monster_rights_good_reform_idea_2_desc:0 "The Monster Rights Act repeals numerous discriminatory laws and uplifts Monsters to have the same legal rights as Mewmans. Furthermore, it prohibits the creation of any more discriminatory laws.\n\n While it is hailed as a success for Monster rights, there are still distinct problems in the monster community due to centuries of oppression. There are also legal debates surrounding discrimination in private sectors..."
    
    shared_mewman_monster_rights_good_reform_idea_3:0 "The Monster Rights Act - The Associaton Amendment"
    shared_mewman_monster_rights_good_reform_idea_3_desc:0 "The Monster Rights Act repeals numerous discriminatory laws and uplifts Monsters to have the same legal rights as Mewmans. Furthermore, it prohibits the creation of any more discriminatory laws.\n\n While it is hailed as a success for Monster rights, there are still distinct problems in the monster community due to centuries of oppression. The Association Amendment purposefully limits anti-discrimination laws to only apply in government insitutions, allowing private citizens and businesses to discriminate against Monsters freely."
    
    shared_mewman_monster_rights_good_reform_idea_4:0 "The Monster Rights Act - The Public Good Amendment"
    shared_mewman_monster_rights_good_reform_idea_3_desc:0 "The Monster Rights Act repeals numerous discriminatory laws and uplifts Monsters to have the same legal rights as Mewmans. Furthermore, it prohibits the creation of any more discriminatory laws.\n\n While it is hailed as a success for Monster rights, there are still distinct problems in the monster community due to centuries of oppression. The Public Good Amendment purposefully expands anti-discrimination laws to apply in both government and private institutions, prohibiting discrimination in businesses and providing the Mosnter community with increased oppurtunity."
    
    shared_mewman_californian_resistance:0 "Californian Resistance"
    shared_mewman_californian_resistance_desc:0 "Our human population is very significant, in fact they outnumber Mewmans. These liberals do not understand the merits of the Mewman Monarchy, and they are not afraid to let that be known."
    
    cleaved_mewman_restorationism_natl_sprt:0 "Mewman Restorationism"
    cleaved_mewman_restorationism_natl_sprt_desc:0 "§C"Lookin' pretty good, kids! Now we can put on our costumes, and after that: THE BLOODY BATTLE CAN COMMENCE!"§!\n§YMewman Restorationism§! is a primarily Mewman socio-political movement arising from the Mewman Crisis. It's main goal is the §Yre-unification§! of the former lands and peoples of the pre-cleaved Kingdom of Mewni through any means necessary. Mewman Restorationism advocates for militarism and aggression in foreign affairs, drawing inspiration both from Mewni's military and conquest-heavy past and certain human philosophies, mainly classical nationalism and Realpolitik.\n\nMewman Restorationism is distinct from general unity sentiments because of it's disregard for the traditional Mewman ideas around casus belli. Instead of viewing the consolidation of the Mewman state through claims of aristocrats, Mewman Restorationism bases itself on the idea of a unified Mewman people/identity, who should be united under one nation.\n\nThis ideology is highly malleable, and almost any Mewman government trying to unite Mewni can adopt it to justify Machiavellian power grabs and territory consolidation."
    
    cleaved_politicized_warrior_class_natl_sprt:0 "Politicized Warrior Class"
    
    