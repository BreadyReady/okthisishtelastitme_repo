    cleaved_student_protests_natl_sprt:0 "Student Protests"
    cleaved_student_protests_natl_sprt_desc:0 "\n\n\n£student_protests_popup_desc_texticon \n\n\n\nHuman students throughout the Kingdom, mostly college and highschoolers, are taking to the streets and campuses to demonstrate their dissatisfaction with the regime. They have stopped attending school, opting instead to disrupt classes and lectures. Some have even gone so far as to vandalize and damage school and government buildings."
    
