 MEWNI_SHARED_POSTUNI_complete_northern_aggression_desc:0 "The War of Northern Aggression"
 
 MEWNI_SHARED_POSTUNI_side_with_johansens:0 "Side with the Johansens"
 MEWNI_SHARED_POSTUNI_side_with_johansens_desc:0 "Side with the Johansens"
 
 MEWNI_SHARED_POSTUNI_side_with_spiderbites:0 "Side with the Spiderbites"
 MEWNI_SHARED_POSTUNI_side_with_spiderbites_desc:0 "Side with the Spiderbites"
 
 MEWNI_SHARED_POSTUNI_take_down_the_frontier:0 "Take down the Frontier"
 MEWNI_SHARED_POSTUNI_take_down_the_frontier_desc:0 "Take down the Frontier"
 
 MEWNI_SHARED_POSTUNI_crownland_economy:0 "Life in the Crownlands"
 MEWNI_SHARED_POSTUNI_crownland_economy_desc:0 "With the reunification of the Crownlands, we can now (somewhat) function as a state and try to improve the lives of our people. Repairing the damage from the shattered crownlands is paramount."
 
 MEWNI_SHARED_POSTUNI_crownland_monument:0 "Monument to the Fallen"
 MEWNI_SHARED_POSTUNI_crownland_monument_desc:0 "The shattering of the crownlands and the vicious wars to reunite it will be seen as a dark time in Mewman history. It is fitting that it be memorialized."
 
 MEWNI_SHARED_POSTUNI_hyperindustrialization_plan:0 "Hyperindustrialization Plan"
 MEWNI_SHARED_POSTUNI_hyperindustrialization_plan_desc:0 "A modern nation needs a modern industry. We must transition from a agrarian, peasant economy to an industrial one."
 
 MEWNI_SHARED_POSTUNI_shock_therapy:0 "Shock Therapy"
 MEWNI_SHARED_POSTUNI_shock_therapy_desc:0 "Following the Cleaving, many economic assets were seized by the government due to the emergency situation necessitating their use in war. With stability returning to the Crownlands, our analysts see an opportunity to inject capital into the free market through privatization, fueling rapid economic growth."
 
 MEWNI_SHARED_POSTUNI_infrastrucure_and_utilities:0 "Infrastructure and Utilities"
 MEWNI_SHARED_POSTUNI_infrastrucure_and_utilities_desc:0 "Asphalt roads, highways, public electricity, running water, etc. These are all components vital to a modern life on Earthni that we lack. By providing them, we will reap rewards in the form of a more robust economy."
 
 MEWNI_SHARED_POSTUNI_prospector_prospects:0 "Prospector Prospects"
 MEWNI_SHARED_POSTUNI_prospector_prospects_desc:0 "Raw Materials are required to create complex products. Boosting our ore industries will help with production."
 
 MEWNI_SHARED_POSTUNI_energy_focus:0 "Prioritize Energy"
 MEWNI_SHARED_POSTUNI_energy_focus_desc:0 "Preserving energy use makes factories more efficient."
 
 MEWNI_SHARED_POSTUNI_rare_earths_focus:0 "Prioritize Rare Earths"
 MEWNI_SHARED_POSTUNI_rare_earths_focus_desc:0 "We must fund prospects into domestic mineral and rare resource production.\n\n§gPerhaps, they should be called rare Earthnis...?§!"
 
 MEWNI_SHARED_POSTUNI_playing_catchup:0 "Playing Catch-up"
 MEWNI_SHARED_POSTUNI_playing_catchup_desc:0 "We are incredibly backwards technologically. Manual labor is still the primary order of the day, and the military relies on old equipment. We must catch up with the rest of the world if we ever hope to compete."
 
 MEWNI_SHARED_POSTUNI_excavation:0 "Excavation Technologies"
 MEWNI_SHARED_POSTUNI_excavation_desc:0 "Focusing on excavation technologies helps us extract more raw ores from the ground with less labor costs."
 
 MEWNI_SHARED_POSTUNI_oiling_up:0 "Oiling Up"
 MEWNI_SHARED_POSTUNI_oiling_up_desc:0 "Oil and fuel is vital in a modern economy. While we may find natural fuel sources, synthetics wouldn't hurt..."
 
 MEWNI_SHARED_POSTUNI_californian_tech_sector:0 "Harness the Californian Tech Sector"
 MEWNI_SHARED_POSTUNI_californian_tech_sector_desc:0 "Before the Cleaving, California was the greatest tech sector on earth. Now that we are prosperous, we can harness that technolgoical capital again."
 
 MEWNI_SHARED_POSTUNI_mewman_middle_class:0 "Mewman Middle Class"
 MEWNI_SHARED_POSTUNI_mewman_middle_class_desc:0 "The economy has built up the lives of the common people, contributing to political stability and support for our policies both foreign and domestic."
 
 MEWNI_SHARED_POSTUNI_investor_trust:0 "Obtain a Respectable Credit Rating"
 MEWNI_SHARED_POSTUNI_investor_trust_desc:0 "A good national credit rating will make investors trust our nation more, in addition to helping us get better loans."
 
 MEWNI_SHARED_POSTUNI_globalzied_economy:0 "Globalized Economy"
 MEWNI_SHARED_POSTUNI_globalzied_economy_desc:0 "A modern economy is a globalized one, allowing us to specialize and perfect certain industries while trading for products that we dont specialize in."
 
 MEWNI_SHARED_POSTUNI_state_and_economy:0 "State and Economy"
 MEWNI_SHARED_POSTUNI_state_and_economy_desc:0 "In the modern world, the state and economy are inextricably linked. In times of prosperity, the state benefits. In times of need, the state intervenes. And in times of war, the State whips the economy into ensuring survival. Through our efforts, we have achieved this dynamic!"
 
 MEWNI_SHARED_POSTUNI_military_industrial_complex:0 "Mewman Military Industrial Complex"
 MEWNI_SHARED_POSTUNI_military_industrial_complex_desc:0 "Continuous investment into war industries has created powerful interest groups who benefit from ongoing wars and manipulate policy to benefit themselves. Morally concerning? Perhaps. But look at those guns!"
 
 MEWNI_SHARED_POSTUNI_crownland_integrity:0 "Full Integrity of the Crownlands"
 MEWNI_SHARED_POSTUNI_crownland_integrity_desc:0 "While we have consolidated the most important parts of the Crownlands, it is not yet technically whole. The Outer Crownlands, a largely poor and rural area even after the Cleaving, has flown under our radar. Thankfully, it's current de-facto leader is amenable to peace and reintegration."
 MEWNI_SHARED_POSTUNI_crownland_integrity_tt:0 "§gThe Outer Crownlands being able to reject subjugation is planned for a future update.§!"
 
 MEWNI_SHARED_POSTUNI_to_the_frontier:0 "To The Frontier!"