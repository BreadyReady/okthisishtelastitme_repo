 MEWNI_SHARED_POSTUNI_royal_politics_tt:0 "NOT AVAILABLE FOR NOW"

 MEWNI_SHARED_POSTUNI_texas_policy:0 "Texas Policy"
 MEWNI_SHARED_POSTUNI_texas_policy_desc:0 "There is currently a Mewman regieme in Texas. What should our policy towards them be?"

 MEWNI_SHARED_POSTUNI_struggle_for_seattle:0 "Struggle for Seattle"
 MEWNI_SHARED_POSTUNI_struggle_for_seattle_desc:0 "Struggle for Seattle Desc"
 MEWNI_SHARED_POSTUNI_struggle_for_seattle_tt:0 "Siding with one particular faction will greatly anger the other, and compromise satisfies neither of them. Consider raising the opinion of which ever side may come out of this mediation badly to above 50, which will greatly increase the chances of them backing down."
 
 MEWNI_SHARED_POSTUNI_continue_monster_rights_reforms:0 "Continue Monster Rights Rights Reforms"
 MEWNI_SHARED_POSTUNI_continue_monster_rights_reforms_desc:0 "The direction of the pre-Cleaving Eclipsan reforms was the right thing to do. Mewni must leave behind it's anti-mosnter past and embrace monsters as sister peoples of Mewni."
 
 MEWNI_SHARED_POSTUNI_political_representation:0 "Political Representation"
 MEWNI_SHARED_POSTUNI_political_representation_desc:0 "By enouraging monsters to fill positions of bureaucratic power, monster interests will be brought up to challenge old laws and ways of thinking. \n\nConveniently, this also embeds grateful loyalists in positions of power..."
 
 MEWNI_SHARED_POSTUNI_support_campaign:0 "Support Campaigns"
 MEWNI_SHARED_POSTUNI_support_campaign_desc:0 "Not everyone is on board with Monster rights reforms. While we could just go forwards with it, it is better to make sure as many Mewmans as possible support our actions. TV and internet ads, social balls and festivals, and all available soft power shall be applied onto our subjects."
 
 MEWNI_SHARED_POSTUNI_land_reimbursment:0 "Land Reimbursements"
 MEWNI_SHARED_POSTUNI_land_reimbursment_desc:0 "Eclipsa's landback programs - forcibly taking Mewman property that was deemed orignally monster property - was extremley disastrous. By implementing buyback programs and compensating Mewman victims, we can atleast mitigate some of the damage."
 
 MEWNI_SHARED_POSTUNI_monster_rights_act:0 "The Monster Rights Act"
 MEWNI_SHARED_POSTUNI_monster_rights_act_desc:0 "Enacting the Monster Rights Act solidifies anti-discrimination measures. This is the piece of legislation that will formally replace old Solarian Law, fully leaving behind the oppresive past. In terms of law, atleast..."
 
 MEWNI_SHARED_POSTUNI_association_amendment:0 "The Association Amendment"
 MEWNI_SHARED_POSTUNI_association_amendment_desc:0 "An amendment to the Monster Rights Act specifies that anti-discrimination laws only apply to government institutions, and private parties are free from such laws. While this limits government overreach and preserves freedom of association, it also allows private citizens and businesses to discriminate against Monsters freely."
 
 MEWNI_SHARED_POSTUNI_public_good_amendment:0 "The Public Good Amendment"
 MEWNI_SHARED_POSTUNI_public_good_amendment_desc:0 "An amendment to the Monster Rights Act specifies that anti-discrimination laws apply to both government and private institutions. While this prohibits private citizens and businesses from discrimination and gives monsters increased oppurtunities, some call it government overreach and a violation of freedom of association."
 
 MEWNI_SHARED_POSTUNI_modernize_solarian_laws:0 "Modernize Solarian Law"
 MEWNI_SHARED_POSTUNI_modernize_solarian_laws_desc:0 "Solarian Law has served Mewmanity well for centuries. Their age, degredation by changing times, and loopholes are what has led to the Mosnter problem to rear it's ugly head deep in the Crownlands, not the intentions of the law itself. To refurbish Solarian law for modern times is the best course of action."
 
 MEWNI_SHARED_POSTUNI_monster_ghetto:0 "The Ghetto"
 MEWNI_SHARED_POSTUNI_monster_ghetto_desc:0 "Restricting where Monsters live will help with Mewman-monster tensions, while also helping us keep an eye on Mosnter activity. It's for the best, they will see."
 
 MEWNI_SHARED_POSTUNI_monster_labor_quotas:0 "Labor Quotas"
 MEWNI_SHARED_POSTUNI_monster_labor_quotas_desc:0 "To ensure Monsterkind is atleast contributing to Mewmanity somewhat, we will guarantee certain hard labor jobs to Monsters. They will, of course, be given less pay and safety standards will be relaxed to get more productivity out of them. The fact that we will also be closing higher up jobs is only natural. They ought to be proud of humble work!"
 
 MEWNI_SHARED_POSTUNI_harsh_incarceration:0 "Harsh Incarceration"
 MEWNI_SHARED_POSTUNI_harsh_incarceration_desc:0 "We cannot tolerate Monster criminals. To ensure Mewman safety, punitive imprisonment will be utilized upon Monster populations. Arrest quotas will be employed to ensure pesky things like proof do not get in the way of safety."
 
 MEWNI_SHARED_POSTUNI_monster_underclass:0 "The Underclass"
 MEWNI_SHARED_POSTUNI_monster_underclass_desc:0 "Monsters undeniably have a place in Mewman society: As an underclass, taking on the worst jobs so that Mewmans can develop better. While Monsters will be paid less, they will also be given welfare like housing and healthcare so they dont get too uppity about their wage. This makes sure they never rise above their station."
 
 MEWNI_SHARED_POSTUNI_violent_monster_expulsion:0 "Violent Expulsion"
 MEWNI_SHARED_POSTUNI_violent_monster_expulsion_desc:0 "Monsters and Mewmans were never meant to mix. For all of Mewni to live in contentment, all peoples must live seperately. It is only fair that it is the Monsters who move, since they are outsiders in the first place. And if any monster refuses to move, well... weapons are meant to protect peace, aren't they?"
 
 MEWNI_SHARED_POSTUNI_modernizing_army:0 "Modernizing The Armed Forces"
 MEWNI_SHARED_POSTUNI_modernizing_army_desc:0 "After the desperate scramble to unite the Crownlands, we can now look outwards to combat more organized, technologically advanced foes."
 
 MEWNI_SHARED_POSTUNI_knighthood_future:0 "Future of the Knighthood"
 MEWNI_SHARED_POSTUNI_knighthood_future_desc:0 "The centuries old knighthood was built for a world of swords, and it cannot be the core of our army. We have to find a new place for our old warriors."
 
 MEWNI_SHARED_POSTUNI_depoliticize_armed_forces:0 "Depoliticize the Armed Forces"
 MEWNI_SHARED_POSTUNI_depoliticize_armed_forces_desc:0 "With the swelling of the Mewman ranks, the old Knighthood no longer holds as much military power. It is time to strip them of more powers so that they serve as part of a loyal, modern military."
 
 MEWNI_SHARED_POSTUNI_open_up_armed_forces:0 "Open up the Armed Forces"
 MEWNI_SHARED_POSTUNI_open_up_armed_forces_desc:0 "With the stripping of Knightly powers, their influence is no longer stopping us from fully embracing modern conscription models."
 
 MEWNI_SHARED_POSTUNI_dynamic_recruitment:0 "Dynamic Recruitment"
 MEWNI_SHARED_POSTUNI_dynamic_recruitment_desc:0 "Turns out, taking millions of people out of civilian life for miltiary purposes has a negative effect on the economy. We need to be ready to swiftly mobilize and demobilize as needed."
 
 MEWNI_SHARED_POSTUNI_restorationist_outlook:0 "Adopt Restorationism"
 MEWNI_SHARED_POSTUNI_restorationist_outlook_desc:0 "The unification of all pre-Cleaved Mewman subjects under one state is the top priority in our foreign affairs. The growing Mewman Restoration movement, if fostered and adopted as official government rhetoric, will help us put aside half measures, caution, and pacifist laze.\n\n§R"Cry, Havoc! and let slip the dogs of war..."§!"
 
 MEWNI_SHARED_POSTUNI_restorationism_realized:0 "Restorationism Realized"
 MEWNI_SHARED_POSTUNI_restorationism_realized_desc:0 ""
 
 MEWNI_SHARED_POSTUNI_take_down_the_lucitors:0 "Take down the Lucitors"
 MEWNI_SHARED_POSTUNI_take_down_the_lucitors_desc:0 "Take down the Lucitors"
 
 MEWNI_SHARED_POSTUNI_take_down_the_pigeons:0 "Take down the Pigeons"
