 MEWNI_SHARED_POSTUNI_texas_policy:0 "Texas Policy"
 MEWNI_SHARED_POSTUNI_texas_policy_desc:0 "There is currently a Mewman regieme in Texas. What should our policy towards them be?"

 MEWNI_SHARED_POSTUNI_struggle_for_seattle:0 "Struggle for Seattle"
 MEWNI_SHARED_POSTUNI_struggle_for_seattle_desc:0 "Struggle for Seattle Desc"
 MEWNI_SHARED_POSTUNI_struggle_for_seattle_tt:0 "Siding with one particular faction will greatly anger the other, and compromise satisfies neither of them. Consider raising the opinion of which ever side may come out of this mediation badly to above 50, which will greatly increase the chances of them backing down."
 
 MEWNI_SHARED_POSTUNI_continue_monster_rights_reforms:0 "Continue Monster Rights Rights Reforms"
 
 MEWNI_SHARED_POSTUNI_political_representation:0 "Political Representation"
 MEWNI_SHARED_POSTUNI_political_representation_desc:0 "By enouraging monsters to fill positions of bureaucratic power, monster interests will be brought up to challenge old laws and ways of thinking. \n\nConveniently, this also embeds grateful loyalists in positions of power..."
 
 MEWNI_SHARED_POSTUNI_support_campaign:0 "Support Campaigns"
 
 MEWNI_SHARED_POSTUNI_land_reimbursment:0 "Land Reimbursements"
 MEWNI_SHARED_POSTUNI_land_reimbursment_desc:0 "Eclipsa's landback programs - forcibly taking Mewman property that was deemed orignally monster property - was extremley disastrous. By implementing buyback programs and compensating Mewman victims, we can atleast mitigate some of the damage."
 
 MEWNI_SHARED_POSTUNI_monster_rights_act:0 "Enact the Monster Right Act"
 
 MEWNI_SHARED_POSTUNI_association_amendment:0 "The Association Amendment"
 MEWNI_SHARED_POSTUNI_association_amendment_desc:0 "An amendment to the Monster Rights Act specifies that anti-discrimination laws only apply to government institutions, and private parties are free from such laws. While this limits government overreach and preserves freedom of association, it also allows private citizens and businesses to discriminate against Monsters freely."
 
 MEWNI_SHARED_POSTUNI_public_good_amendment:0 "The Public Good Amendment"
 MEWNI_SHARED_POSTUNI_public_good_amendment_desc:0 "An amendment to the Monster Rights Act specifies that anti-discrimination laws apply to both government and private institutions. While this prohibits private citizens and businesses from discrimination and gives monsters increased oppurtunities, some call it government overreach and a violation of freedom of association."
 
 MEWNI_SHARED_POSTUNI_modernize_solarian_laws:0 "Modernize Solarian Law"
 
 MEWNI_SHARED_POSTUNI_modernizing_army:0 "Modernizing The Royal Army"
 
 MEWNI_SHARED_POSTUNI_restorationist_outlook:0 "Adopt Restorationism"
 MEWNI_SHARED_POSTUNI_restorationist_outlook_desc:0 "The unification of all pre-Cleaved Mewman subjects under one state is the top priority in our foreign affairs. The growing Mewman Restoration movement, if fostered and adopted as official government rhetoric, will help us put aside half measures, caution, and pacifist laze.\n\n§R"Cry, Havoc! and let slip the dogs of war..."§!"
 
 MEWNI_SHARED_POSTUNI_crownland_economy:0 "Life in the Crownlands"
 
 MEWNI_SHARED_POSTUNI_crownland_monument:0 "Monument to the Fallen"
 MEWNI_SHARED_POSTUNI_crownland_monument_desc:0 "The shattering of the crownlands and the vicious wars to reunite it will be seen as a dark time in Mewman history. It is fitting that it be memorialized."
 
 MEWNI_SHARED_POSTUNI_hyperindustrialization_plan:0 "Hyperindustrialization Plan"
 MEWNI_SHARED_POSTUNI_hyperindustrialization_plan_desc:0 "A modern nation needs a modern industry. We must transition from a agrarian, peasant economy to an industrial one."
 
 MEWNI_SHARED_POSTUNI_infrastrucure_and_utilities:0 "Infrastructure and Utilities"
 MEWNI_SHARED_POSTUNI_infrastrucure_and_utilities_desc:0 "Asphalt roads, highways, public electricity, running water, etc. These are all components vital to a modern life on Earthni that we lack. By providing them, we will reap rewards in the form of a more robust economy."
 
 MEWNI_SHARED_POSTUNI_prospector_prospects:0 "Prospector Prospects"
 
 MEWNI_SHARED_POSTUNI_energy_focus:0 "Prioritize Energy"
 
 MEWNI_SHARED_POSTUNI_rare_earths_focus:0 "Prioritize Rare Earths"
 MEWNI_SHARED_POSTUNI_rare_earths_focus_desc:0 "We must fund prospects into domestic mineral and rare resource production.\n\n§gPerhaps, they should be called rare Earthnis...?§!"
 
 MEWNI_SHARED_POSTUNI_playing_catchup:0 "Playing Catch-up"
 
 MEWNI_SHARED_POSTUNI_excavation:0 "Excavation Technologies"
 
 MEWNI_SHARED_POSTUNI_oiling_up:0 "Oiling Up"
 
 MEWNI_SHARED_POSTUNI_californian_tech_sector:0 "Harness the Californian Tech Sector"
 
 MEWNI_SHARED_POSTUNI_mewman_middle_class:0 "Mewman Middle Class"
 
 MEWNI_SHARED_POSTUNI_investor_trust:0 "Obtain a Respectable Credit Rating"
 
 MEWNI_SHARED_POSTUNI_globalzied_economy:0 "Gloablized Economy"
 
 MEWNI_SHARED_POSTUNI_state_and_economy:0 "State and Economy"
 MEWNI_SHARED_POSTUNI_state_and_economy_desc:0 "In the modern world, the state and economy are inextricably linked. In times of prosperity, the state benefits. In times of need, the state intervenes. And in times of war, the State whips the economy into ensuring survival. Through our efforts, we have achieved this dynamic!"
 
 MEWNI_SHARED_POSTUNI_military_industrial_complex:0 "Mewman Military Industrial Complex"
 MEWNI_SHARED_POSTUNI_military_industrial_complex_desc:0 "Continuous investment into war industries has created powerful interest groups who benefit from ongoing wars and manipulate policy to benefit themselves. Morally concerning? Perhaps. But look at those guns!"
 
 MEWNI_SHARED_POSTUNI_crownland_integrity:0 "Full Integrity of the Crownlands"
 MEWNI_SHARED_POSTUNI_crownland_integrity_desc:0 "While we have consolidated the most important parts of the Crownlands, it is not yet technically whole. The Outer Crownlands, a largely poor and rural area even after the Cleaving, has flown under our radar. Thankfully, it's current de-facto leader is amenable to peace and reintegration."
 MEWNI_SHARED_POSTUNI_crownland_integrity_tt:0 "The states of the Outer Crownlands can be cored with decisions.\n§gThe Outer Crownlands beign able to reject annexation is planned for a future update.§!"
 
 MEWNI_SHARED_POSTUNI_to_the_frontier:0 "To The Frontier!"