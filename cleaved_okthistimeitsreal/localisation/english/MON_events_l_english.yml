 MON_event.4.t:0 "The Proposal"
 MON_event.4.2.desc:0 "moon making star and tom smooch and marry. lucitor gets puppeted"
 MON_event.4.a:0 "no choice for now."

 
 MON_notification_event.1.t:0 "Moon Cracks Down on San Havensisco"
 MON_notification_event.1.desc:0 "[MON.getleader] has moved military, police, and bureaucratic elements loyal to her into key positions in San Havensisco. This, in tandem with Moon's recent messages to Star telling her that she will need stricter obidience from the duchy, likely means that Moon is making a power play for further control over the duchy."
 MON_notification_event.1.a:0 "Rats!"
 MON_notification_event.1_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_iron_fist_over_san_havensisco$§!, which grants §Y[STA.getflag][STA.getname]§! reduced autonomy gain and which leads to further focuses which give §Y[STA.getflag][STA.getname]§! harsh debuffs.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing these further focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.2.t:0 "Moon Seizes Valuable Technology"
 MON_notification_event.2.desc:0 "[MON.getleader] has ordered the seizure of key technology sectors in San Havensisco. While this seizure may temporarily provide [MON.getname] with a technological advantage, it also severely cripples San Havensisco's technological capacity, and future talents may look elsewhere to establish startups or research."
 MON_notification_event.2.a:0 "Rats!"
 MON_notification_event.2_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_seize_havensisco_tech$§!, which grants §Y[STA.getflag][STA.getname]§! a technology debuff.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.3.t:0 "Moon Seizes Valuable Industrial Schematics"
 MON_notification_event.3.desc:0 "[MON.getleader] has ordered the seizure of key company archives in San Havensisco and the suspension of certain patent rights, all focused on finding insights into industrial design. While this seizure may temporarily provide [MON.getname] with a industrial advancement, it also severely cripples San Havensisco's economic capacity."
 MON_notification_event.3.a:0 "Rats!"
 MON_notification_event.3_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_seize_havensisco_schematics$§!, which grants §Y[STA.getflag][STA.getname]§! a stability debuff.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.4.t:0 "Moon Orders Harsh Production Quotas"
 MON_notification_event.4.desc:0 "[MON.getleader] has ordered a harsh and somewhat unrealistic increase in industrial production and financial tribute from us. With her loyalists in powerful positions, we cannot aleiviate this order."
 MON_notification_event.4.a:0 "Rats!"
 MON_notification_event.4_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_harsh_production_quotas$§!, which grants §Y[STA.getflag][STA.getname]§! increased economic tribute to §Y[MON.getflag][MON.getname]§!.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.5.t:0 "Moon Orders Economic Raids!"
 MON_notification_event.5.desc:0 "[MON.getleader] has ordered incredibly unrealistic increases in industrial production and financial tribute from us. With our inability to pay, she has ordered the forceful seizure of economic assets."
 MON_notification_event.5.a:0 "Rats!"
 MON_notification_event.5_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_raid_havensisco$§!, which damages certain states in §Y[STA.getflag][STA.getname]§! severely.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.6.t:0 "Moon Seizes Natural Resources!"
 MON_notification_event.6.desc:0 "[MON.getleader] loyalists in our nation have signed over vital resource rights over to Moon's government."
 MON_notification_event.6.a:0 "Rats!"
 MON_notification_event.6_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_seize_resources$§!, which grants some of §Y[STA.getflag][STA.getname]§!'s resources to §Y[MON.getflag][MON.getname]§!.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.7.t:0 "Moon Seizes Vital Natural Resources!"
 MON_notification_event.7.desc:0 "[MON.getleader] loyalists in our nation have signed over greatly vital resource rights over to Moon's government."
 MON_notification_event.7.a:0 "Rats!"
 MON_notification_event.7_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_seize_greater_resources$§!, which grants the rest of §Y[STA.getflag][STA.getname]§!'s resources to §Y[MON.getflag][MON.getname]§!.\n\n§Y[STA.getflag][STA.getname]§! may prevent §Y[MON.getflag][MON.getname]§! from pursuing further harmful focuses by completing the focus §Y$STA_resist_mandates$§!."
 
 MON_notification_event.8.t:0 "[MON.Getleader] Announces Intentions to Help Us Further!"
 MON_notification_event.8.desc:0 "Moon, in in a private letter to Star, has promised to leave the duchy largely alone and autonomous. This comes with the caveat that this autonomy is expected to be put to use, and that the duchy must support Moon, even if it is mroe free to choose how to do so."
 MON_notification_event.8.a:0 "Great!"
 MON_notification_event.8_tt:0 "§Y[MON.getflag][MON.getname]§! has completed the focus §Y$MON_guiding_hand_over_san_havensisco$§!, which allows §Y[STA.getflag][STA.getname]§! to pursue focuses which lower it's autonomy and buff §Y[MON.getflag][MON.getname]§!!"
 
 MON_notification_event.9.t:0 "Wedding Confirmed!"
 MON_notification_event.9.desc:0 "After extensive negotiation, our proposal of a wedding between Star and Tom has been accepted by the Lucitor family . This will normalize diplomacy between us and the Lucitors and restore Butterfly dominion over the Lucitors.\n\nNot to mention, global media loves a royal wedding!"
 MON_notification_event.9.a:0 "Gather the Wedding Servants!"
 
 MON_flavor_event.1.t:0 "The School Pledge of Mewmanity"
 MON_flavor_event.1.desc:0 ""Thank you Queen Moon. Thank you because I am joyful. Thank you because I am well. No matter how old I become, I will never forget how we received Queen Moon after she united Mewni. Centuries will pass, and a generation still to come will regard us as the happiest of Mewmans, as the most fortunate of Mewmanity, because we lived in the century of centuries. Because we were privileged to live under your reign, our inspired leader.\n\n Yes, we regard ourselves as the happiest of Mewmans because we are the contemporaries of a ruler who never had an equal in Earthni's history. The people of all ages will call on thy name, which is strong, beautiful, wise, and marvelous. Thy name is engraved on every building, on every monument, on every place on the face of earthni, and in the hearts of all people. Everytime I have been in her presence, in the flesh or in an image, I have been subjugated by her strength, her charm, her grandeur. I have experienced a great desire to sing, to cry out, to shout with joy and happiness.\n\nI shall be eternally happy and joyous, all thanks to you, great educator, our Queen. Everything belongs to you, chief of our great nation\n\nAnd when I come to love someone in matrimony, and when I have children in service to Mewmanity and our great Educator, our Queen, the first words my child will utter shall be..."
 MON_flavor_event.1.a:0 "ALL FOR THE QUEEN!""
 MON_flavor_event.1_tt:0 "Every student, from daycare to college PhD students, will recite this pledge in full. Hourly."
 
 MON_flavor_event.2.t:0 "The Glamarous Study"
 #MON_flavor_event.2.desc:0 "At the evening of a long day of politicking, Moon decided to pay a visit Star. They had last seen each other when the marriage between Star and Tom was publicly announced, and while Star may have kept a royal composure, Moon knew Tom wasn't Star's first choice in terms of love.\n\nMoon didn't find Star in her room, nor did she find her in the feasting halls or flower courts. Moon was strategizing on how to deal with a rebellious run away situation, when she finally spotted a familiar splotch of blonde hair in the corner of her eye as she was passing the royal.\n\n Moon crept in quietly. Star was at a computer desk, while also hunched over a book on Mewman political history. Moon called out to her, §0"Star? What're you doing here, of all places?"§!\n\n §C"Hi Mom."§! Star didn't look up from her materials. §C"Reading up on both Mewman and Human history. These are unprecedented times but, I think some lessons can still be learned. Especially with the marriage coming up. I ordered the library to be cleared out, by the way."§!\n\nA short silence ensued, only broken by Star's turn of an ancient page. Impressed by Star's dilligence, comfort with power, and wise thinking, Moon still couldn't help feel a pang of guilt. §0"Listen, Star, when I married your father, it was very lucky that both our love and the family interests lined up. That's rare for a royal marriage. I'm sorry you couldn't have the same experience I had. I hope you can forgive me."§!\n\nStar's head perked up from the thick tome. She looked up and closed her eyes, catching her haggard breath. Her throat twitched. Then she spun around on the imported office chair, serious, tried, and direct. §C"There's nothing to feel sorry for. This is my first choice for Mewmanity. Love is irrelevant on the scale of Kingdoms."§! Another silence, this time unbroken, then she smiled. §C"You did a good job, Mom. Don't worry about it."§!\n\nIt was a courtly smile. Perhaps fake, but the point of a courtly smile was that you wouldn't be able to tell if it was."
 MON_flavor_event.2.desc:0 "Moon had last seen Star when the marriage between her and Tom was publicly announced. While Star may have kept a royal composure, Moon knew Tom wasn't Star's first choice in terms of love. She decided to check up on her daughter now that the announcement was official for a couple days.\n\n Asking around, Moon found Star at the castle library. She was at a computer desk, while also hunched over a book on Mewman political history. Moon called out to her, §0"Star? What're you doing here, of all places?"§!\n\n§C"Hi Mom."§! Star didn't look up from her materials. §C"Reading up on both Mewman and Human history. These are unprecedented times but, I think some lessons can still be learned. Especially with the marriage coming up. I ordered the library to be cleared out for this."§!\n\nA short silence ensued, only broken by Star's turn of an ancient page. Despite being impressed by Star's dilligence, comfort with power, and wise thinking, Moon still felt a pang of guilt. §0"Listen, Star, when I married your father, it was very lucky that both our love and the family interests lined up. That's rare for a royal marriage. I'm sorry you couldn't have the same experience I had. I hope you can forgive me."§!\n\nStar's head perked up from the thick tome. She looked up and closed her eyes, catching her haggard breath. Her throat twitched. Then she spun around on the imported office chair, serious, tried, and direct. §C"There's nothing to feel sorry for. This is my first choice for Mewmanity. Love is irrelevant on the scale of Kingdoms."§! Another silence, this time unbroken, then she smiled. §C"You did a good job, Mom. Don't worry about it."§!\n\nIt was a courtly smile. Perhaps fake, but the point of a courtly smile was that you wouldn't be able to tell if it was."
 MON_flavor_event.2.a:0 "The Queen of Mewni left. The heir to Mewni returned to her studies."
 MON_flavor_event.2_tt:0 "§YAll the luxuries of aristocratic power come at a cost.§!"