l_english:

 neutrality:0 "Monarchy"
 neutrality_desc:0 "Monarchy"
 neutrality_noun:0 "Monarchy"
 sparkle_monarchy:0 "The Second Enlightenment"
 sparkle_monarchy_desc:0 "\n\n\n£star_nrx_desc_texticon \n\n\n\n§YThe Second Enlightenment§!, sometimes referred to as the §YReformed Dark Enlightenment§! or §YSan Havensisco Feudalism§!, is a political philosophy advocating for collaboration within a stratified society with only two castes having input on the government: the business-oligarchs near the top and the absolute monarch at the very top.\n\nThe Second Enlightenment espouses that extending free market principles to governance will promote excellency and punish incompetence. It also concedes that such a system on it's own is prone to both divisive infighting and inefficient monopoly formation, and thus an enlightened, absolute monarch must steer capitalist governance towards the national interest.\n\nOriginating from the post-Cleaved San Havensisco, it can be described as a synthesis between Neoreactionary Philosophy, Enlightened Absolutism, and Fascist Corporatism."
 mewman_progressivism:0 "Mewman Progressivism"
 mewman_progressivism_desc:0 "§YMewman Progressivism§! is a political ideology which advocates for progressive reform of Mewman government while preserving the Mewman feudal state and monarchy. In the Mewman context, progressivism involves equal political rights for monsters and demilitarization of the government.\n\nMewman progressivism finds it's origins in the wake of Solaria's conquests. The first queen to arguably espouse Mewman Progressivism is Queen Crescenta the Eager, 31st Queen of Mewni, who set up collaboration governments with Monsters. The last Mewman queen pre-Cleaving to espouse Mewman progressivism is Queen Eclipsa. Mewman Progressivism and Mewman Conservatism have been diametrically opposed since the days of Solaria."
 mewman_conservatism:0 "Mewman Conservatism"
 mewman_conservatism_desc:0 "§YMewman Conservatism§! is a political ideology which advocates for the preservation of conservative Mewman government and society. In the Mewman context, conservatism involves preserving or increasing the powers of lower nobles with a weaker head monarch, strict stratification of Mewman society between Mewmans and monsters, and militarization of the Mewman nation.\n\nMewman conservatism finds it's origins in the initial foundation of the Kingdom of Mewni with conflicts between the lower aristocracy and the Queen being constant, but modern Mewman Conservatism finds it's origins in the wake of Solaria's conquests. The first queen to arguably espouse modern Mewman Conservatism is Queen Festivia The Fun, 30th Queen of Mewni, who threw lavish parties to appease lower aristocracy. The last Mewman queen pre-Cleaving to espouse Mewman conservatism is Queen Moon, who after the Cleaving adopted a more centralizing ideology. Mewman Progressivism and Mewman Conservatism have been diametrically opposed since the days of Solaria."
 
 fascism:0 "Authoritarianism"
 fascism_desc:0 "Authoritarian Regime"
 fascism_noun:0 "Authoritarianism"
 gen_nazism:0 "Authoritarianism is a form of government where strict obedience to a central authority is enforced at the expense of personal freedom."
 cle_solarianism:0 "Classical Solarianism"
 cle_solarianism_desc:0 "§YClassical Solarianism§! is the political philosophy of Queen Solaria Butterfly, the 28th Queen of Mewni who reigned 300 years ago. This involves extreme militarism, Mewman expansionism, and extreme anti-monster policies."
 cle_knightly_supremacy:0 "Hyper-Totalitarian Transcendent Militarism"
 cle_knightly_supremacy_desc:0 "§YHyper-Totalitarian Transcendent Militarism§! is an ideology that promotes the military, warriorhood, and "glorious death" as the ultimate purpose of life and civilization, as well as the best destiny for an individual soul. To this end, all peoples must be pressed into military service regardless of physical ability, and all aspects of culture and governance outside of the military must be destroyed.\n\nWhile a standing death is the ultimate goal, proponents say that the road towards it must be filled with beauty, passion, and striving, culminating in the creation of a "beautiful life and a beautiful death." Despite the poetry, such a philosophy often results in looting and hedonism.\n\nIt can be described as an ideology derived from the philosophies of figures such as Gabriele d'Annunzio, Ernst Junger, and Yukio Mishima, as well as the concepts of Individualist Illegalism and the Propaganda of the Deed applied on a mass scale. Many have also called it a suicide-cult."
 cle_mewman_corpratism:0 "Mewman Absolutism"
 cle_mewman_corporatism_desc:0 "\n\n\n£mewman_absolutism_desc_texticon \n\n\n\n§YMewman Absolutism§! is a political philosophy that seeks to unite Mewni under the absolute authority of the Crown while organizing society through a system of state/crown-supervised institutions. Under Mewman Absolutism, every subject is duty bound to the greater nation through the Queen.\n\nAt its core stands the monarch, regarded as the living embodiment of the nation and the ultimate source of political legitimacy.\n\nIt can be described as a synthesis between Absolute Monarchy and Fascist Corporatism"
