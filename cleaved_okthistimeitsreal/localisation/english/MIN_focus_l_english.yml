l_english:
 MIN_good_ideas:0 "Good Ideas"
 MIN_good_ideas_desc:0 "While Mina may have been defeated in the Crownlands, her good ideas are still worth fighting for!\n\n§0"You know... you can get rid of me. It's so easy. But the sweet thing is I'll never really be gone, 'cause I've got good ideas. And the thing about good ideas is they tend to kinda hang around..."§!"
 
 MIN_recruitment_drives:0 "Recruitment Drives"
 MIN_recruitment_drives_desc:0 "We must shore up our manpower reserves from all sources: Frontier Mewmans looking to serve Solarian civilization, peasants looking to work their way up in Mewman society, and even humans who want adventure or to go looting."
 
 MIN_rile_up_the_frontier_mewmans:0 "Rile up the Frontier Mewmans"
 MIN_rile_up_the_frontier_mewmans_desc:0 "Frontier Mewmans are Mewmans that have lived on the outskirts of Mewman civilization. Serving as the bulwark against monsters for hundreds of years, they have preserved a Mewman culture of Solarian service and vehement anti-monsterism. We can take advantage of their unique culture to drum up more support for Mina's endeavours, who might be the only Mewman ruler left that shares Solarian values!"