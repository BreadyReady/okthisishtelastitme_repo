 mewni_shared_kingdom_diplo_events.1.c:0 "Side with the Spdierbites"
 
 mewni_shared_kingdom_diplo_events.4.t:0 "The Crown sides with us!"
 mewni_shared_kingdom_diplo_events.4.desc:0 ""
 mewni_shared_kingdom_diplo_events.4.a:0 "Great!"
 
 mewni_shared_kingdom_diplo_events.5.t:0 "The Crown sides against us!"
 mewni_shared_kingdom_diplo_events.5.desc:0 ""
 mewni_shared_kingdom_diplo_events.5.a:0 "We must not rock the boat..."
 mewni_shared_kingdom_diplo_events.5.b:0 "We must defy them!"
 
 mewni_shared_postuni_events.2.t:0 "Choosing a site"
 mewni_shared_postuni_events.2.desc:0 "Two sites have been identified for the monument: One on the Los Angeles beachfront, and one near Butterfly Castle. While this may seem simple, the tensions between Mewmans and Californians have complicated matters.\n\nIf we choose to put the monument near Butterfly castle, californians will feel snubbed, and they will think that our government is ignoring the contributions that californians have made. If we choose to put the monument near LA, the Mewman people will feel snubbed and that our government is choosing the rich californians over our own Mewmanity.\n\nIt seems like a lose-lose situation. What should we do?"
 mewni_shared_postuni_events.2.a:0 "Put the monument near Butterfly Castle"
 mewni_shared_postuni_events.2.b:0 "Put the monument near LA."
 mewni_shared_postuni_events.2.c:0 "Y'know what? Nobody gets the monument now!"
 
 mewni_shared_postuni_events.3.t:0 "Fate of the Knighthood"
 mewni_shared_postuni_events.3.desc:0 "The knighthood is a centuries-long institution of Mewni that holds a special place in Mewman culture. However, the realities of modern warfare have made their current model obsolete. Not to mention, their political power is obstructing other reforms. We have a few options to address this problem.\n\nOne option is to reform them to be part of the officer corps and trainers. Their expirience and cultural influence will be inspiring to young Mewman recruits.\n\nAlternativley, we could transition the knighthood into a ceremonial role, pivoting their influence to drum up support for domestic policy.\n\nLastly, a "nuclear" option is to go full throttle with new recruitment to accelerate the stripping of their powers."
 mewni_shared_postuni_events.3.a:0 "Let them lead the next generation of warriors."
 mewni_shared_postuni_events.3.b:0 "Let them inspire Mewmanity away from modern warfare."
 mewni_shared_postuni_events.3.c:0 "Their way and culture should be left to the past."
 mewni_shared_postuni_events.3.c_tt:0 "National spirit §Y$cleaved_phase_out_knights_natl_sprt$§! will be removed upon the completion of national focus §Y$MEWNI_SHARED_POSTUNI_open_up_armed_forces$§!"
 
 mewni_shared_postuni_events.4.t:0 "Shock Therapy"
 mewni_shared_postuni_events.4.desc:0 "Two schools of thought have emerged among privatization advocates:\n\nOne side wants privatization to be rapidly done in large chunks. They say that corporations are more efficient when they are large, and that time is of the essence in getting the economy up to snuff. Plus, it would provide the state with an injection of cold hard cash. However, it should be noted that most people who support this are big business owners who will likely end up with most of these assets.\n\nThe other side says that the government has to let their assets enter the economy through giving ownership to existing managers. In this way, inefficiencies will naturally expose themselves in the free market and assets will break themselves up or keep themselves big as the free market demands."
 mewni_shared_postuni_events.4.a:0 "Swiftly sell off state assets to the highest bidder in large chunks."
 mewni_shared_postuni_events.4.a_tt:0 "This may have adverse effects in the future..."
 mewni_shared_postuni_events.4.b:0 "Let state assets be tested in the free market."
 mewni_shared_postuni_events.4.c:0 "Why reduce our own control? Hold onto our assets!"
 mewni_shared_postuni_events.4.c_tt:0 "This is an option unique to [MON.getname]"
 
 mewni_shared_postuni_flavor.1.t:0 "Student Protests"
 mewni_shared_postuni_flavor.1.desc:0 "In response to our efforts to harness the Californian educational establishment, a wave of unrest has swept through the said educational institutions. Human students have deserted their studies in favor of political demonstrations. Universities, with the efforts of student bodies and even some human professors, have become centers of political organizing, while classrooms stand near empty. Several public buildings have already been defaced or damaged.\n\nThese protests are advocating for the restoration of American style freedoms, democratic government, are against newly introduced Mewman elements in the curriculum, and some are advocating for student loan forgiveness and other traditional american progressive policies.\n\nThe disturbances have become too widespread to dismiss as isolated incidents, and we must face the fact that this is a greater prolonged trend."
 mewni_shared_postuni_flavor.1.a:0 "They could care less as long as someone'll bleed..."
 mewni_shared_postuni_flavor.1.a_tt:0 "§YThis is part of the Californian Resistance story arc, which is not complete as of this demo.§!"
 
 mewni_shared_postuni_flavor.2.t:0 "Knight's Coup Busted!"
 mewni_shared_postuni_flavor.2.desc:0 "A coup plot against the government was recently discovered and shut down! The perpetrators of the plot, a cabal of younger knights who had ties to the vanquished warlord Higgs, plotted to overthrow the government to restore knightly powers.\n\nThe downfall of the coup came when the close circle attempted to expand the plot to older knights. Appalled by this treachery and supporting the stripping of their own powers out of a sense of duty to Mewmanity, the older knights led an attack on the coup's headquarters and arrested all perpetrators, turning them into the Mewman government.\n\nSurprisingly, this fiasco has led to increased support for our reforms. The selfless acts of the elder Knighthood, along with their own advocacy for reform, has allowed our government to push for more controll over the knighthood."
 mewni_shared_postuni_flavor.2.a:0 "Goodness!"
 
 mewni_shared_postuni_flavor.3.t:0 "Modern Oligarchs"
 mewni_shared_postuni_flavor.3.desc:0 "Following our decision to sell state assets to the highest bidders, certain individuals have consoldiated power through their monopolization of these assets.\n\nWhile not an immediate threat to state power, they certainly leverage their power to create a better business enviroment for themselves, which can undermine state authority. In addition, this fiasco has eroded public faith in the government."
 mewni_shared_postuni_flavor.3.a:0 "This was completely unexpected!"
 
 mewni_shared_postuni_flavor.2.t:0 "Knight's Coup Busted!"
