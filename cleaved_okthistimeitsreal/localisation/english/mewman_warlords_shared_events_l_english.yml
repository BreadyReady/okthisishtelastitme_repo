 mewni_shared_postuni_flavor.2.a:0 "Goodness!"
 
 mewni_shared_postuni_flavor.4.t:0 "Tale of Two Civilizations"
 mewni_shared_postuni_flavor.4.desc:0 "The festivities celebrating Mewman restoration had a heavy air of anxiety snuffing the most jubilant of feelings. Mewmans knew that the destiny of Mewmanity had not yet been secured. For every ceremonial marcher adorning the streets, actual troops were being trained, excersized, and deployed. For every consumer good that a Mewman indulged in, the military procured guns, tanks, and more. For every child born in manufatured swaddle, many times more teenagers' lives were worried over by parents anticipating the coming conflict.\n\nIn the east, across the great plains and the former edge of the world (now marked by the Missisipi river,) stood the Colossus, the dragon, Goliath, the sword of Damocles: America. While a shell of it's former self, it still had decades of expirience in modern war, and a people motivated to reconquer their so-called rightful west.\n\nCan Mewmanity and Humanity be reconciled? Will a war leave one people standing who will inherit the world? Or will it be a war of total dimensional anniahlation?\n\nWho is to say? But one thing is for certain..."
 mewni_shared_postuni_flavor.4.a:0 "Neither one will not go quietly into the night..."
 mewni_shared_postuni_flavor.4.a_tt:0 "§CYou have reached the end of the Cleaved Demo!§!\n\nThank you for playing the mod. This mod has been worked in an on-again off-again fashion for a few years now. I am happy to see atleast a demo be released!\n\nThis was largely a one-man operation, with art... uh... "procured" online (credits on steam page)\nSpecial thanks to the Hoi4 modding den for the continuous code help and ITGuy042, a modding partner I worked with on a similar "cartoon" mod a few years back (Countdown to Weirdmaggedon.)"