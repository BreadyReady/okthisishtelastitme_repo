 HIG_sons_and_daughters_of_the_century:0 "Sons and Daughters of the Century"
 
 HIG_estates_high_commission:0 "Establish the Estates High Commission"
 HIG_estates_high_commission_desc:0 "The Estates High Commission is established to perpetuate the existence of, and to facilitate cooperation between, the peasant, aristocrat, and warrior classes. Ultimately, it's goal is to allow the Warrior class to supersede the Aristocrats at the top of the social hierarchy, as is the natural way of the world."
 
 HIG_supremacy_theory:0 "Supremacy Theory"
 HIG_supremacy_theory_desc:0 "The conduct of nations is mainly the manifestation of an eternal struggle between peoples. We must acknowledge this, and realize that the ultimate goal of a people is not economic propserity or to establish a lethargic peace, but to dominate all other nations, to reign supreme, and to ultimatley eradicate all who may challenge them."
 
 HIG_primacy_of_the_knighthood:0 "Primacy of the Knights"
 HIG_primacy_of_the_knighthood_desc:0 "The military is the ultimately the only thing that matters in a nation. The economy, technology, so-called "civil rights", it's all nothing compared to the military, which is really the manifestation of the nation's will. We must acknowledge truth, and recognize the knighthood as the top priority, even into the far future."
 
 HIG_eliminate_pretenders_to_power:0 "Eliminate Pretenders to Power"
 HIG_eliminate_pretenders_to_power_desc:0 "Aristocrats, human democratic representatives, peasant union leaders, activist intellectuals, etc. are all pretenders to real power, which comes from the blade of a sword. They are a danger, and threaten to pull us back into pacifist dark ages. They must be eliminated, and their institutions appropriated for military use or otherwise dismantled."
 