l_english:
 STA_event.1.t:0 "Invitation to the Mewman Commonwealth"
 STA_event.1.desc:0 ""
 STA_event.1.a:0 "Mewni must stand together!"
 STA_event.1.b:0 "Our diffrences are too great"
 
 STA_event.2.t:0 "Cooperating at the Congress of Mewni"
 STA_event.2.desc:0 "With the Congress of Mewni approaching, we must determine our stance on the proposed "Mewman Commonwealth".\n\nOn one hand, such a unification will prevent much bloodshed and will help Mewni come together. On the other hand, despite Star's promises, there is no real guarantee that our own powers and policy visions will be respected, beyonf just legal guarantees."
 STA_event.2.a:0 "We should present reasonable conditions in the pursuit of peace."
 STA_event.2.a_tt:0 "Will become a cooperating nation and the congress will come closer to succeeding.\n\nSuccess in the Congress of Mewni will result in getting annexed by Star's Mewni"
 STA_event.2.b:0 "Send demands that the others will not agree to. This is just a diplomatic show, after all..."
 STA_event.2.b_tt:0 "Will become an uncooperating nation and the congress will fail."
 
 STA_event.3.t:0 "[FROM.GetLeader] will cooperate!"
 STA_event.3.desc:0 "[FROM.GetLeader] has sent us a letter stating that they intend to cooperate fully with the cognress of Mewni!"
 STA_event.3.a:0 "Awesome!"
 
 STA_event.5.t:0 "[FROM.GetLeader] will not cooperate!"
 STA_event.5.desc:0 "[FROM.GetLeader] has sent us a letter stating that they intend to show up at the congress of Mewni, but the demands they have sent for further cooperation are unreasonable!"
 STA_event.5.a:0 "Darn it!"
 
 STA_event.4.t:0 "[FROM.GetName] Rejects the Mewman Commonwealth!"
 STA_event.4.desc:0 "[FROM.GetName] has rejected the invitation to the Mewman Commonwealth!"
 STA_event.4.a:0 "Aw..."
 
 STA_event.6.t:0 "Congress of Mewni reaches an agreement!"
 STA_event.6.desc:0 "All the nations of the Mewman Crownlands have come to an agreement on peaceful unification! Our disparate factions have agreed to work together underneath a 'Mewman Commonwealth', where their interests will have to gain the approval of others to go forward. This will ensure progress while, hopefully, not upsetting anyone too much.\n\nStar Butterfly, as the head of the Mewman Congress, has been seen by many has the face of the new Commonwealth."
 STA_event.6.a:0 "Awesome!"
 
 STA_event.7.t:0 "Genocidal Accusations"
 STA_event.7.desc:0 "As we enforce our laws of maintaining mewman monarchism and try to integrate the identity of the Californians into our own, the Californians are resisting. Protests have erupted across the streets as they demand autonomy, that we remove the powers of the royalty, and for us to stop cultural integration programs. In fact, some humans have gone so far as to say that Star is commiting a genocide against the Californians!\n\nWhile most humans atleast see the genocidal moniker as too extreme, the fact is that Californian discontent is growing. While they may be peaceful now, who knows where this movement might lead?"
 STA_event.7.a:0 "This is ridiculous. Star is not commiting a genocide!"
 STA_event.7.b:0 "Let's nip this in the bud. Arrest the extremists... and the protest leaders while you're at it."
 
 STA_notification_event.1.t:0 "[STA.GetName] Sends Tech Engineers!"
 STA_notification_event.1.desc:0 "To Write"
 STA_notification_event.1.a:0 "Great!"
 STA_notification_event.1_tt:0 "§Y[STA.getflag][STA.getname]§! has completed a focus which grants you a research slot!"
 
 STA_notification_event.2.t:0 "[STA.GetName] Grants Economic Gifts!"
 STA_notification_event.2.desc:0 "To Write"
 STA_notification_event.2.a:0 "Great!"
 STA_notification_event.2_tt:0 "§Y[STA.getflag][STA.getname]§! has gained a national focus which transfers extra economic assets to overlord!"
 
 STA_notification_event.3.t:0 "[STA.Getleader] Public Image Benefits Us!"
 STA_notification_event.3.desc:0 "To Write"
 STA_notification_event.3.a:0 "Great!"
 STA_notification_event.3_tt:0 "§Y[STA.getflag][STA.getname]§! has completed a focus which grants you extra war support!"
 
 STA_notification_event.4.t:0 "Control Over [STA.Getname] Slips Significantly!"
 STA_notification_event.4.desc:0 "[STA.Getleader], in her infinite insolence, has instructed her duchy not to follow any of our new orders! While we still hold some control over the duchy, our capacity to carry out measures to bring the duchy to heel has been severely hampered."
 STA_notification_event.4.a:0 "Rats!"
 STA_notification_event.4_tt:0 "§Y[STA.getflag][STA.getname]§! has completed a focus which makes you unable to take focuses branching from the focus §Y$MON_iron_fist_over_san_havensisco$§!!"
 
 STA_notification_event.5.t:0 "[STA.Getleader] Announces Intentions to Help Us Further!"
 STA_notification_event.5.desc:0 "Star, in order to prove her administrative prowess, has promised to deliver us economic and political boons from her duchy beyond what she is obligated."
 STA_notification_event.5.a:0 "Great!"
 STA_notification_event.5_tt:0 "§Y[STA.getflag][STA.getname]§! has completed a focus which grants you 50 political power, and which also leads to focuses which will grant you further bonuses!"

 STA_flavor_event.1.t:0 "The Common Years"
 STA_flavor_event.1.desc:0 "§R"Star? You in there?"§!\n\n§C"Coming!"§!\n\nMarco was outside Star's chambers, sheepishly holding a stack of documents. The days following her marriage to Tom have been hectic around the castle. Residual balls, meetings between House Butterfly and House Lucitor, new servant and quarters arrangements for Tom (who had now come to live in the palace,) etc. For Marco, this all meant less personal contact with Star, which was detrimental for the human support campaign he was pushing through. In fact, he feared that this restricted access to personal time with Star would become permanent. He feared this for political reasons, and for less professional reasons as well...\n\nThe door opened. §C"Yes, Marco?"§! She was brushing her hair and was in casual vacation dress. Today was the last day before she and Tom went off to honeymoon.\n\n§R"Could you sign this? It's a..."§! Marco's eyes scanned her. Even her vacation dress was stunning to him: puffy shoulder balls, jewled buttons, the cutest skirt-leggings combo, and her face. Oh her face, a face that... that was looking past him. Like she was looking to some unknown distance beyond him, beyond this very palace. It was the same look Marco found when he tried to catch her eye while she was at the wedding altar with Tom. §R"It's to restore some democratic rights to a small human town."§!\n\nIn two beats, Star scanned the stack of papers in Marco's hands then looked back up at him: §C"I don't have time to read that right now. Bring it to my secretary."§!\n\n§R"But it'll be weeks before it'll get to you that way!"§! Marco frowned. §R"Come on, you can trust me. Safe kid! Just sign it, please?"§!\n\n§C"Sorry Marco, no."§!\n\nThey excahanged their pleasantries, then Star shut the door. Marco had to admit that Star was right to not sign anything she didn't read, and also didn't vet with her advisors. She had grown into a very competent stateswoman. But still, while in front of Star's chamber door Marco hugged the papers, closed his eyes, and looked up into the sky, contemplating whether or not to just leave this place and never look back.\n\nThen he sighed, and whispered an answer to himself:"
 STA_flavor_event.1.a:0 "§R"No, my people need me."§!"
 STA_flavor_event.1_tt:0 "§RI almost wish we were butterflies and liv’d but three summer days—three such days with you I could fill with more delight than fifty common years could ever contain.§!"
 #STA_flavor_event.1_tt:0 "§RWe were such a good\nAnd loving invention.\nAn airplane made from blood and life.\nWings and everything.\nWe hovered a little above the earth.\n\nWe even flew a little.§!"
 #STA_flavor_event.1_tt:0 "§RThey dismantle us\nEach from the other.\nAs far as I'm concerned\nThey are all engineers.\nAll of them.§!"
 
 STA_flavor_event.2.t:0 "Dr. Marco, Ph.D."
 STA_flavor_event.2.desc:0 "§0"Professor Diaz, is it true that you knew Queen Star as a child?"§!\n\n The student's sudden personal question pierced through the cloud of psycho-sociological analysis that were the student's previous questions. Marco was an associate professor, manning office hours for an advanced psych class at UCLA.\n\n§R"Yes, that's true. I was part of a foster family for the exchange program. We were, ah, both 14 when we met, I believe."§! Marco went back to reading the student's paper. It was a fine paper, fitting for a student, but through the typos and errors Marco could find glipses of a promising young mind.\n\n§0"What was she like?"§! Again, a question that pierced Marco's academic thinking. He looked up at the student and realized that the kid was completley fascinated with the fact that he knew the Queen. Dissmissing the question wouldn't sate the kid's curiosity... plus it would be a little cruel.\n\n§R"She was, ah, fun. Inquisitve. Never afraid to question, and then to go into the unknown, if needed. A bit irresponsible, but she remedied that since I last saw her. She'll make a fine Queen."§! Marco closed his eyes, remembering that time right before the cleaving, in that pig-goat stable. He smiled. §R"We got into all sorts of antics together."§!\n\n§0"What was your relationship like with her?"§! Now this question, this question got on his nerves.\n\n§R"Why so many personal questions? Office hours are precious, you know?"§!\n\n§0"Well, yes, but... there are rumors about you and the Queen."§!\n\n Marco, still looking down at the paper, suddenly found numerous problems with the student's work: illogical style choices, insufficient explainations, sources that were just barely within the required recency timeframe... He clenched his teeth without showing them. §R"No more personal questions, please. Let's talk about your paper. I'm sorry but, I think you're gonna have to reevlauate the whole premise. You'll likely have to rewrite the whole thing, and definitely have to find new sources..."§!\n\nAfter a few minitues of going into every little detail, Marco handed the student back the copy of the essay. The student's mouth hung open as he stood up, perhaps in shock with how much fault Professor Diaz had found in a 5 page paper. Marco, smiling, leaning leaning back in his chair, perhaps feeling as if he had made himself appear larger, asked: §R"Any more questions?"§!"
 #THIS WOULD HAVE BEEN MARCO AND JACKIE ENDING UP TOGETHER BUT I DONT THINK ITS THE RIGHT MOVE CONSIDERING I WANT JACKIE AND HER LESBIAN LOVER TO PLAY A PART IN A CALIFORNIAN UPRISING STA_flavor_event.2.desc:0 "§L"Hey, Marco, check this out."§! The TV in the corner of the beachfront shop, a cheap and old model set up for viewing by the employees, switched on. Marco, who was manning the shop, glanced over to the TV, not at all wanting to rip his view away from the ocean sunset.\n\nA Mewman in full judge garb, reading from an altar: §0"Do you, Star of Hosue Butterfly, solemnly swear to take Tom of House Lucitor as your husband?"§!\n\n§C"I do."§! Star, in traditional royal mewman marriage gear. Cyan, of course, with a ridiculously long skirt held up by a few birds. She looked ridiculous, Marco thought.\n\n §0"Furthermore, do you solemnly swear that you will defend your husband, stick by his side, in sickness and in health, through chaos or through..."§! Turns out, royal Mewman marriage traditions require extremley long vow ceremonies.\n\nBy the time Marco had already been gazing at the sunset for some time, the person who switched the TV on spoke up from behind him again: §L"Looks like you've got friends in high places. You think you could get Star to visit us for her honeymoon? The advertizing would be great."§!\n\n§R"As long as you don't force me to break up with you to do it, Jackie."§!\n\n§L"Oh, shut it."§! Jackie playfully punched Marco in the shoulder."
 STA_flavor_event.2.a:0 "§0"So, uh, did you and Star ever smooch?"§!"
 STA_flavor_event.2_tt:0 "§R"Get out of this office."§!"