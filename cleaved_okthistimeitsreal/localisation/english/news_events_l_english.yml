 mewni_warlords_news_event.19.t:0 "Star to Marry Marco"
 
 mewni_warlords_news_event.20.t:0 "Star to Marry Tom"
 mewni_warlords_news_event.20.desc:0 "It's official: Star, daughter of Queen Moon and heir apparent to the Mewman throne, is to marry Tom of the Lucitor family!\n\nStar and Tom, who is the head of the powerful house Lucitor, have been suspected of dating each other on and off since early teen-hood. Their official union signifies political union between houses Butterfly and Lucitor, with the Lucitor Kingdom being brought back into the Crownland fold.\n\nCourt sources said that the couple is quite compatible and the two have a loving future ahead of them, though Queen Moon did announce that the spreading of slanderous rumors surrounding Star's feelings would not be tolerated..."
 mewni_warlords_news_event.20.a:0 "Exciting!"
 
 mewni_warlords_news_event.21.t:0 "The Royal Marriage"
 mewni_warlords_news_event.21.desc:0 "The marriage ceremonies between Star and Tom has concluded! A public multi-day event, members of house Butterfly and house Lucitor met in Butterfly Castle to celebrate while parades were held throughout the kingdom for the masses. The celebrations peaked with Star and Tom exchanging vows at a traditional Mewman altar. Papparazzi ate the event up, especially the post-vow ball where Star and Tom gracefully danced. It was only then when Star broke the royal, professional expression she had been holding for days: She smiled while dancing with her husband.\n\nMewmans all over Earthni are celebrating the marriage in their own way, and a military company even named their newly issued artillery piece in honor of the marriage: 'The TomStar Cannon.'"
 mewni_warlords_news_event.21.a:0 "I guess those rumors about Marco Diaz weren't true after all!"
 
 mewni_warlords_news_event.22.t:0 "[FROM.GetLeader] Unites the Texas Core!"
 mewni_warlords_news_event.22.desc.a:0 "[FROM.GetLeader] has eliminated all other leaders claiming overlordship over Texas, which coincides with the most Mewman-populated areas of the Mewman Frontier. While not all of Texas has been consolidated, [FROM.GetLeader] has taken the richest and most strategically important areas.\n\nMina Loveberry, who was thought to have been totally defeated after the Cleaving, is back in full force. She has made no pretenses about her desire to march west towards the Crownlands, and to ultimatley unite Mewmanity in a neo-solarian, anti-monster empire."
 mewni_warlords_news_event.22.desc.b:0 "[FROM.GetLeader] has eliminated all other leaders claiming overlordship over Texas, which coincides with the most Mewman-populated areas of the Mewman Frontier. While not all of Texas has been consolidated, [FROM.GetLeader] has taken the richest and most strategically important areas.\n\n Dallas Leader DETAILS TO WRITE"
 mewni_warlords_news_event.22.desc.c:0 "[FROM.GetLeader] has eliminated all other leaders claiming overlordship over Texas, which coincides with the most Mewman-populated areas of the Mewman Frontier. While not all of Texas has been consolidated, [FROM.GetLeader] has taken the richest and most strategically important areas.\n\n democrat texas DETAILS TO WRITE"
