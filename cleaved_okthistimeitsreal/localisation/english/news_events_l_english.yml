 mewni_warlords_news_event.5.desc:0 ""
 mewni_warlords_news_event.5.a:0 "Glory to Star!"
 mewni_warlords_news_event.5.b:0 "Such Insolence!"
 mewni_warlords_news_event.5.c:0 "Another Contender in the Mewman Crisis..."
 
